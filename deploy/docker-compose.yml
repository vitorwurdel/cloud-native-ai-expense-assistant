services:
  postgres:
    image: postgres:16
    container_name: expense-assistant-postgres
    environment:
      POSTGRES_DB: expense_assistant
      POSTGRES_USER: expense_user
      POSTGRES_PASSWORD: expense_password
    ports:
      - "5433:5432"
    volumes:
      - expense_assistant_postgres_v2:/var/lib/postgresql/data

  qdrant:
    image: qdrant/qdrant:latest
    container_name: expense-assistant-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"

  redis:
    image: redis:7
    container_name: expense-assistant-redis
    ports:
      - "6379:6379"

volumes:
  expense_assistant_postgres_v2: